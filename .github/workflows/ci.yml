name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
# A new run of a pull request cancels the older one. A push or a manual run is
# keyed by its commit and never cancels a running run: a master run makes a
# baseline.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Each job's timeout-minutes is about 3 times its longest successful run (at
# least 5), so a hung step fails in minutes, not after GitHub's 6 hours (#261).
jobs:
  # Tells the later jobs when a pull request changes only documents: every path
  # is under docs/ or ends in .md. A renamed file counts by both of its paths.
  # An empty list, a list of 3000 names or more (the API limit), a push, and a
  # manual run all give false. A failed API call fails the job.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      docs_only: ${{ steps.docs.outputs.docs_only }}
    steps:
      - id: docs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          docs_only=false
          if [ -n "$PR_NUMBER" ]; then
            names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files?per_page=100" \
              --jq '.[] | .filename, (.previous_filename // empty)')
            count=$(printf '%s\n' "$names" | grep -c . || true)
            if [ "$count" -gt 0 ] && [ "$count" -lt 3000 ] && ! printf '%s\n' "$names" | grep -qvE '^docs/|\.md$'; then
              docs_only=true
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
  sql-tests:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Keep this version equal to the supabase devDependency in package.json.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x studio,mailpit
      # Runs the Schedule generator once as the generator role, as pnpm dev does.
      - run: pnpm dev:schedule
      # Compares the gate fixtures (gate/fixtures/) with the stack's real responses.
      - run: pnpm check:fixtures
      - run: scripts/run-sql-tests.sh
      # The functional suite skips on a docs-only pull request.
      - if: needs.changes.outputs.docs_only != 'true'
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - id: e2e
        if: needs.changes.outputs.docs_only != 'true'
        run: pnpm test:e2e
      - if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    # lighthouse never skips on a push: docs_only is false there, as for screenshots.
    needs: [build, changes, sql-tests, screenshots, lighthouse]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
  # After a real deploy: every live route answers 200 (scripts/live-check.ts).
  live-check:
    needs: deploy
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the live routes
        run: pnpm live:check
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
  # The screenshot gate (gate/), one matrix entry per engine. On master it
  # captures the baseline of its engine and uploads it. On a pull request it
  # compares with the baseline of the merge-base commit. Keep the image tag
  # equal to the @playwright/test version in package.json.
  screenshots:
    name: screenshots-${{ matrix.engine }}
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit, firefox]
    needs: changes
    if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    permissions:
      contents: read
      actions: read
    env:
      ENGINE: ${{ matrix.engine }}
      # Firefox refuses to start when $HOME is not owned by root (the container
      # sets /github/home). This is the workaround that Playwright names.
      HOME: /root
      # The pull request's own commit, not the merge commit that GitHub builds:
      # a newer master must not change the frames.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - run: git config --global --add safe.directory '*'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Master push or manual run on master: capture the baseline. No compare.
      - if: github.event_name != 'pull_request'
        run: pnpm gate:capture --project "$ENGINE-*"
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gate-baseline-${{ matrix.engine }}
          path: gate-baseline
          retention-days: 30
          if-no-files-found: error
      # Pull request: find the baseline of the merge-base commit. It counts only
      # when the whole master run succeeded and its artifact has not expired.
      - id: base
        if: github.event_name == 'pull_request'
        run: echo "sha=$(git merge-base origin/master "$HEAD_SHA")" >> "$GITHUB_OUTPUT"
      - id: lookup
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "ci.yml",
              branch: "master",
              head_sha: process.env.BASE_SHA,
              status: "completed",
              per_page: 20,
            });
            for (const run of data.workflow_runs) {
              if (run.conclusion !== "success") continue;
              const { data: found } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                name: `gate-baseline-${process.env.ENGINE}`,
              });
              if (found.artifacts.some((artifact) => !artifact.expired)) {
                core.setOutput("run-id", String(run.id));
                return;
              }
            }
      - if: github.event_name == 'pull_request' && steps.lookup.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: gate-baseline-${{ matrix.engine }}
          path: gate-baseline
          run-id: ${{ steps.lookup.outputs.run-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      # No usable baseline: capture the merge-base commit first, with this
      # pull request's gate tests. The merge-base may have no gate at all.
      - if: github.event_name == 'pull_request' && steps.lookup.outputs.run-id == ''
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add ../gate-base "$BASE_SHA"
          pnpm --dir ../gate-base install --frozen-lockfile
          pnpm gate:capture --src ../gate-base --project "$ENGINE-*"
      # The runner exits with 2 when frames differ and no test errored, and with
      # 1 on an error. The visual-change label excuses only code 2.
      - id: compare
        if: github.event_name == 'pull_request'
        env:
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
        run: |
          code=0
          pnpm gate --project "$ENGINE-*" || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" = 2 ] && [ "$LABELED" = true ]; then
            exit 0
          fi
          exit "$code"
      # A labelled run that passes with differences uploads them too.
      - if: always() && steps.compare.outputs.code != '' && steps.compare.outputs.code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: gate-failure-${{ matrix.engine }}
          path: |
            test-results
            gate-report
            gate-results.json
          retention-days: 14
  # The Lighthouse guard (scripts/lighthouse.ts): one runner and one Lighthouse
  # process per page of lighthouse/floors.json. Keep the matrix equal to that file.
  lighthouse:
    name: lighthouse-${{ matrix.page }}
    strategy:
      fail-fast: false
      matrix:
        page: [daily-mixed, daily-protocols, daily-applications, archive, board, blitz, history, history-blitz, codex, privacy]
    needs: changes
    if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/master') && needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The guard builds against the stub server and prints the medians of the page.
      - name: Run the Lighthouse guard
        run: pnpm lighthouse:guard --page "$PAGE" --out lighthouse-reports
        env:
          PAGE: ${{ matrix.page }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports-${{ matrix.page }}
          path: lighthouse-reports
          retention-days: 14
          if-no-files-found: ignore
