name: CI
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
  sql-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Keep this version equal to the supabase devDependency in package.json.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: supabase start -x studio,mailpit
      # Runs the Schedule generator once as the generator role, as pnpm dev does.
      - run: pnpm dev:schedule
      # Compares the gate fixtures (gate/fixtures/) with the stack's real responses.
      - run: pnpm check:fixtures
      - run: scripts/run-sql-tests.sh
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - id: e2e
        run: pnpm test:e2e
      - if: ${{ !cancelled() && steps.e2e.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
  deploy:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
  # The screenshot gate (gate/). On master it captures the baseline and uploads
  # it. On a pull request it compares with the baseline of the merge-base
  # commit. Keep the image tag equal to the @playwright/test version in
  # package.json.
  screenshots-chromium:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    permissions:
      contents: read
      actions: read
    env:
      # The pull request's own commit, not the merge commit that GitHub builds:
      # a newer master must not change the frames.
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
      - run: git config --global --add safe.directory '*'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Master push or manual run on master: capture the baseline. No compare.
      - if: github.event_name != 'pull_request'
        run: pnpm gate:capture
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: gate-baseline-chromium
          path: gate-baseline
          retention-days: 30
          if-no-files-found: error
      # Pull request: find the baseline of the merge-base commit. It counts only
      # when the whole master run succeeded and its artifact has not expired.
      - id: base
        if: github.event_name == 'pull_request'
        run: echo "sha=$(git merge-base origin/master "$HEAD_SHA")" >> "$GITHUB_OUTPUT"
      - id: lookup
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: "ci.yml",
              branch: "master",
              head_sha: process.env.BASE_SHA,
              status: "completed",
              per_page: 20,
            });
            for (const run of data.workflow_runs) {
              if (run.conclusion !== "success") continue;
              const { data: found } = await github.rest.actions.listWorkflowRunArtifacts({
                owner,
                repo,
                run_id: run.id,
                name: "gate-baseline-chromium",
              });
              if (found.artifacts.some((artifact) => !artifact.expired)) {
                core.setOutput("run-id", String(run.id));
                return;
              }
            }
      - if: github.event_name == 'pull_request' && steps.lookup.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: gate-baseline-chromium
          path: gate-baseline
          run-id: ${{ steps.lookup.outputs.run-id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
      # No usable baseline: capture the merge-base commit first, with this
      # pull request's gate tests. The merge-base may have no gate at all.
      - if: github.event_name == 'pull_request' && steps.lookup.outputs.run-id == ''
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          git worktree add ../gate-base "$BASE_SHA"
          pnpm --dir ../gate-base install --frozen-lockfile
          pnpm gate:capture --src ../gate-base
      # A pull request with the visual-change label passes when frames differ.
      - id: compare
        if: github.event_name == 'pull_request'
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
        run: pnpm gate
      # `continue-on-error` hides a failure from `failure()`, so test the step.
      - if: always() && steps.compare.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: gate-failure-chromium
          path: |
            test-results
            gate-report
          retention-days: 14
