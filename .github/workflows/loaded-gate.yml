name: Loaded gate
run-name: Loaded gate (${{ inputs.ref }}, ${{ inputs.engine }}, ${{ inputs.runs }} runs)
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test
        required: true
        default: master
      engine:
        description: Browser engine of the gate projects to run
        required: true
        type: choice
        options: [webkit, chromium, firefox]
        default: webkit
      runs:
        description: Number of loaded compares (1 to 20)
        required: true
        type: number
        default: 20

permissions:
  contents: read

env:
  # The name prefix of each compare's failure artifact; the summary reads it.
  FAILURE_ARTIFACT: loaded-gate-failure-
  # The prefix of the gate project names to run; scripts/ci/loaded-gate.sh reads it.
  ENGINE: ${{ inputs.engine }}

jobs:
  baseline:
    name: Baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host --init
    env:
      # The same environment as the screenshots job of ci.yml.
      HOME: /root
    outputs:
      runs: ${{ steps.plan.outputs.runs }}
    steps:
      - name: Plan the runs
        id: plan
        env:
          RUNS: ${{ inputs.runs }}
        run: |
          if [ "$RUNS" -lt 1 ] || [ "$RUNS" -gt 20 ]; then
            echo "runs must be 1 to 20, got $RUNS" >&2
            exit 1
          fi
          echo "runs=[$(seq -s, 1 "$RUNS")]" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Trust the checkout
        run: git config --global --add safe.directory '*'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The baseline is an unloaded capture, as in the local loaded runs.
      - name: Capture the baseline
        run: pnpm gate:capture --project "$ENGINE-*"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gate-baseline-${{ inputs.engine }}
          path: gate-baseline
          retention-days: 1
          if-no-files-found: error

  loaded-compare:
    # The summary step finds these jobs by this name (its COMPARE_JOB).
    name: Loaded compare (run ${{ matrix.run }})
    needs: baseline
    strategy:
      # Every run must report: the result is a failure count, not a first failure.
      fail-fast: false
      matrix:
        run: ${{ fromJSON(needs.baseline.outputs.runs) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host --init
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Trust the checkout
        run: git config --global --add safe.directory '*'
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # The script comes from this workflow's commit: an older tested ref has none.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/ci
          path: .loaded-gate
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: gate-baseline-${{ inputs.engine }}
          path: gate-baseline
      - name: Compare the frames under CPU load
        run: .loaded-gate/scripts/ci/loaded-gate.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ env.FAILURE_ARTIFACT }}${{ matrix.run }}
          path: |
            test-results
            gate-report
            gate-results.json
          retention-days: 14

  summary:
    name: Summary
    needs: [baseline, loaded-compare]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: scripts/ci
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: ${{ env.FAILURE_ARTIFACT }}*
          path: failures
      - name: List the failed runs and tests
        env:
          # The name of the loaded-compare jobs, up to the run number.
          COMPARE_JOB: "Loaded compare (run "
          BASELINE: ${{ needs.baseline.result }}
          RUNS: ${{ inputs.runs }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/loaded-gate-summary.sh failures >> "$GITHUB_STEP_SUMMARY"
