name: Schedule Action
on:
  schedule:
    - cron: "5 0 * * *"
  workflow_dispatch:
concurrency:
  group: schedule-action
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm schedule:generate
        env:
          SCHEDULE_DATABASE_URL: ${{ secrets.SCHEDULE_DATABASE_URL }}
          SCHEDULE_SEED: ${{ secrets.SCHEDULE_SEED }}
  keep-alive:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Read the All-time leaderboard view
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          set -e
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::notice::SUPABASE_URL or SUPABASE_ANON_KEY is empty; skipping the ping"
            exit 0
          fi
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" "${SUPABASE_URL%/}/rest/v1/leaderboard_all_time?select=account_id&limit=1")
          echo "Supabase answered the leaderboard read with HTTP $status"
          case "$status" in
            2[0-9][0-9]) ;;
            *) exit 1 ;;
          esac
